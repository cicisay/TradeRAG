# 部署编排（10-4）：完整单机栈 = PG + Redis + Milvus + API×N + worker + Nginx
# 启动：docker compose up -d --scale api=2
# 访问：http://127.0.0.1:18080/app/（经 Nginx；副本数可 --scale 调整）

services:
  # ===== PostgreSQL（业务库，PRD 3.1；多副本下 SQLite 不可用）=====
  postgres:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "127.0.0.1:5432:5432"   # 供宿主机跑搬数/体检脚本
    volumes:
      - pg_data:/var/lib/postgresql/data
      # 11-2：Grafana 只读账号（仅首次初始化执行；已有卷按文档 §5 手动执行一次）
      - ./deploy/postgres/init-grafana-ro.sql:/docker-entrypoint-initdb.d/10-grafana-ro.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ===== Milvus Standalone 及其依赖（向量库）=====
  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data
    volumes:
      - minio_data:/minio_data

  milvus:
    image: milvusdb/milvus:v2.4.15
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      # 10-4 安全收口：开启 RBAC 后匿名连接被拒（默认账号 root/Milvus，
      # 应用凭据见 backend/.env 的 MILVUS_USER/MILVUS_PASSWORD）
      COMMON_SECURITY_AUTHORIZATIONENABLED: "true"
    ports:
      # 未启用认证版本曾绑 0.0.0.0 属于事故隐患；现在即使有 RBAC 也只绑回环
      - "127.0.0.1:19530:19530"   # gRPC（pymilvus 连接）
      - "127.0.0.1:9091:9091"     # 指标
    depends_on:
      - etcd
      - minio
    volumes:
      - milvus_data:/var/lib/milvus

  # ===== Redis（Celery 队列 / 限流 / 缓存）=====
  redis:
    image: redis:7.2-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  # ===== FastAPI 应用（无固定端口，走 Nginx；--scale api=2 水平扩）=====
  api:
    build: ./backend
    image: traderag-api:latest
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      # 容器内一律用服务名直连（覆盖 .env 里的 127.0.0.1）
      DATABASE_URL: postgresql+psycopg://rag:rag@postgres:5432/rag
      REDIS_URL: redis://redis:6379/0
      MILVUS_URI: http://milvus:19530
    volumes:
      - ./backend/models:/app/models:ro      # 3.3GB 模型挂载不进镜像
      - ./frontend:/app/frontend:ro          # 前端静态资源（FRONTEND_DIR = BASE_DIR.parent/frontend）
      - ./backend/files:/app/files           # 上传文件（API 与 worker 共享）
      - ./backend/data:/app/data             # 评测报告等运行数据
      # eval_dir 默认 "../eval" → 容器内 /eval；不挂载则评测集列表为空（批量评测下拉框空白）
      - ./eval:/eval:ro
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_started
      redis:
        condition: service_started

  # ===== Celery worker（solo 池，与 api 同镜像同挂载）=====
  worker:
    image: traderag-api:latest
    restart: unless-stopped
    command: ["python", "scripts/run_worker.py"]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://rag:rag@postgres:5432/rag
      REDIS_URL: redis://redis:6379/0
      MILVUS_URI: http://milvus:19530
    volumes:
      - ./backend/models:/app/models:ro
      - ./frontend:/app/frontend:ro
      - ./backend/files:/app/files
      - ./backend/data:/app/data
      - ./eval:/eval:ro
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_started
      redis:
        condition: service_started

  # ===== Nginx（SSE 透传 + 多副本负载均衡）=====
  nginx:
    image: docker.m.daocloud.io/library/nginx:alpine
    restart: unless-stopped
    ports:
      # 8080 落在 Windows Hyper-V/WSL 动态保留段内会随机绑定失败，改用 18080
      - "127.0.0.1:18080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  # ===== Prometheus + Grafana + node-exporter（可选，11-2）=====
  # 与 Langfuse 同属 obs profile：日常 `docker compose up -d` 不启动，零内存占用。
  # UI: http://127.0.0.1:13001（admin / rag-grafana-2026）；Prometheus: 127.0.0.1:19090
  # 指标来源：api 的 /metrics（dns_sd 自动发现多副本）+ 业务 PG（只读账号）
  prometheus:
    image: docker.m.daocloud.io/prom/prometheus:v2.54.1
    restart: unless-stopped
    profiles: ["obs"]
    ports:
      - "127.0.0.1:19090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      - --web.enable-lifecycle

  grafana:
    image: docker.m.daocloud.io/grafana/grafana:11.2.0
    restart: unless-stopped
    profiles: ["obs"]
    ports:
      - "127.0.0.1:13001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: rag-grafana-2026
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://127.0.0.1:13001
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/rag-ops.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  node-exporter:
    image: docker.m.daocloud.io/prom/node-exporter:v1.8.2
    restart: unless-stopped
    profiles: ["obs"]
    ports:
      - "127.0.0.1:19100:9100"
    command: ["--path.rootfs=/host"]
    volumes:
      # Docker Desktop(Windows) 不支持 rslave 传播，去掉；只读挂载足够采 CPU/内存/磁盘
      - /:/host:ro

  # ===== postgres-exporter（可选，obs profile；采 PG 连接数/慢查询/表膨胀）=====
  postgres-exporter:
    image: docker.m.daocloud.io/prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    profiles: ["obs"]
    ports:
      - "127.0.0.1:19187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://rag:rag@postgres:5432/rag?sslmode=disable"

  # ===== redis-exporter（可选，obs profile；采 Redis 内存/连接数/命令延迟）=====
  redis-exporter:
    image: docker.m.daocloud.io/oliver006/redis_exporter:v1.62.0
    restart: unless-stopped
    profiles: ["obs"]
    ports:
      - "127.0.0.1:19121:9121"
    environment:
      REDIS_ADDR: "redis:6379"

  # ===== Langfuse 全链路追踪（可选，11-1）=====
  # 仅 docker compose --profile obs up -d 时启动；日常不带 --profile 不占内存。
  # UI: http://127.0.0.1:13000  账号 admin@trade-rag.local / trade-rag-admin
  # RAG 后端通过 env_file 里的 LANGFUSE_HOST/PUBLIC_KEY/SECRET_KEY 上报，
  # key 为空时后端自动 no-op，不启动 Langfuse 也没有任何影响。
  langfuse-db:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    restart: unless-stopped
    profiles: ["obs"]
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 30

  langfuse:
    image: docker.m.daocloud.io/langfuse/langfuse:2
    restart: unless-stopped
    profiles: ["obs"]
    ports:
      - "127.0.0.1:13000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://127.0.0.1:13000
      NEXTAUTH_SECRET: bdttAP8t77RIUrgcwf5UOdbbWb6TnA4b
      SALT: sTwZacVnY4LcnCs1cRYn1c2uHInBzFHu
      # 必须是 64 位 hex（openssl rand -hex 32）；用 base64 短串会卡在
      # "Invalid environment variables"，服务 500 起不来（真机踩过）
      ENCRYPTION_KEY: fead131d1159a95f67a087bb4b292b00b917283ed4c21c3a1482a23978fd80bb
      TELEMETRY_ENABLED: "false"
      # 无头初始化：免注册，项目 API Key 预置（与 backend/.env 中一致）
      LANGFUSE_INIT_ORG_ID: trade-rag
      LANGFUSE_INIT_ORG_NAME: trade-rag
      LANGFUSE_INIT_PROJECT_ID: trade-rag-prod
      LANGFUSE_INIT_PROJECT_NAME: trade-rag-prod
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf_mqQH6WtrAOzk1BFRQaWgTzE5q7pF
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf_OeO8gzxh0nUf1ze1At7T1LzrX1I8
      LANGFUSE_INIT_USER_EMAIL: admin@trade-rag.local
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: trade-rag-admin
    depends_on:
      langfuse-db:
        condition: service_healthy

volumes:
  pg_data:
  etcd_data:
  minio_data:
  milvus_data:
  redis_data:
  langfuse_pg_data:
  prometheus_data:
  grafana_data:
