# TradeRAG 反向代理（10-4）
# 要点：
# 1. 多 api 副本负载均衡——用变量 + Docker 内置 DNS（127.0.0.11）按请求重解析，
#    否则 upstream server api:8000 只在启动时解析一次，永远打到同一个副本；
# 2. SSE 透传——proxy_buffering off 是流式回答的生命线，开了缓冲用户会"整段卡住再一坨出来"；
# 3. 上传体积——对齐 settings.max_upload_mb。
upstream traderag_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # 上传上限与 PRD 1.4 一致（默认 50MB，超了直接 413 不占用后端资源）
    client_max_body_size 50m;

    # DNS 重解析：副本扩缩容后 10 秒内生效
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 普通 API
    location / {
        set $upstream http://api:8000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SSE 流式问答：禁缓冲、禁超时切割、长连接
    location /api/v1/chat {
        set $upstream http://api:8000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        chunked_transfer_encoding on;
    }
}
