# 看板自动加载：把同目录下的 *.json 全部注册到 "RAG" 文件夹
apiVersion: 1

providers:
  - name: rag-dashboards
    orgId: 1
    folder: RAG
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      # 看板 JSON 单独放 /etc/grafana/dashboards，别和本配置文件混在一个目录
      # （Grafana 只认 .json，混放会在日志里刷解析错误）
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
